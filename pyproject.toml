[project]
name = "agentic-optimization"
version = "0.1.0"
description = "An agent-based prototype for generating mathematical optimization models from user inputs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.4",
    "pulp>=2.9,<4",
    "streamlit>=1.50",
    "groq>=0.28",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "python-dotenv>=1.2.2",
    "langchain-anthropic>=1.4.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentic_optimization"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # PULP_CBC_CMD ships with PuLP 3 and works without extra installs.
    # pulp<4 is pinned; switching to COIN_CMD requires `pulp[cbc]`.
    "ignore:PULP_CBC_CMD is deprecated:DeprecationWarning",
]
