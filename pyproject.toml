[project]
name = "agentic-optimization"
version = "0.1.0"
description = "An agent-based prototype for generating mathematical optimization models from user inputs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.4",
    "pulp>=2.9",
    "streamlit>=1.45",
    "groq>=0.28",
    "langchain>=1.3.11",
    "langchain-groq>=1.1.3",
    "langchain-core>=1.4.8",
    "langchain-openai>=1.3.3",
    "python-dotenv>=1.2.2",
    "langchain-anthropic>=1.4.7",
    "pypdf>=5.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
